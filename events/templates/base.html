<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}메이플 이벤트{% endblock %}</title>
    <!-- Tailwind + DaisyUI (CDN, 빌드 과정 없음) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen bg-base-200">

    <!-- 상단 바 -->
    <header class="navbar bg-base-100 shadow">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="{% url 'events:list' %}" class="text-xl font-bold">🍁 메이플 이벤트</a>
            <a href="{% url 'events:archive' %}" class="btn btn-ghost btn-sm">지난 이벤트</a>
        </div>
    </header>

    <!-- 각 페이지 내용이 여기에 들어옵니다 -->
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- 하단 -->
    <footer class="footer footer-center p-6 text-base-content/60">
        <p>메이플 이벤트 요약 · 개인 운영</p>
    </footer>

</body>
</html>
