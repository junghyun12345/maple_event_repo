<!DOCTYPE html>
<html lang="ko" data-theme="winter">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}메이플 이벤트{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        /* 단풍 그림에 맞춘 색: 단풍 오렌지 포인트 + 따뜻한 바탕 */
        :root { --accent: #E9571F; --accent-ink: #FFFFFF; --accent-dark: #C8430F; }
        body { font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #F4F1EA; }

        .badge-primary { background: var(--accent) !important; color: var(--accent-ink) !important; border: 0 !important; }
        .btn-primary { background: var(--accent) !important; border-color: var(--accent) !important; color: var(--accent-ink) !important; }
        .btn-primary:hover { background: var(--accent-dark) !important; border-color: var(--accent-dark) !important; }

        /* 헤더 (배경 사진 위) */
        .site-header {
            position: relative;
            background: linear-gradient(135deg, #2f6d3a, #6d8f3a);
            padding-bottom: 28px;
        }
        .site-header.has-hero {
            min-height: 520px;
            background:
                linear-gradient(90deg, rgba(15,20,25,.60) 0%, rgba(15,20,25,.22) 50%, rgba(15,20,25,0) 100%),
                linear-gradient(180deg, rgba(15,20,25,.38) 0%, rgba(15,20,25,0) 26%),
                url('/media/hero.png') center/cover no-repeat;
        }

        .header-bar { display: flex; align-items: flex-start; padding: 0 40px; }
        .brand { flex: 1; color: #fff; font-weight: 700; font-size: 15px; padding-top: 20px; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.35); }
        .header-cta { flex: 1; }

        /* 흰 탭 네비게이션 */
        .nav-pill {
            position: relative; flex: none;
            background: #fff; display: flex; align-items: center; gap: 6px;
            padding: 14px 24px; border-radius: 0 0 22px 22px;
        }
        .nav-pill::before, .nav-pill::after { content: ""; position: absolute; top: 0; width: 22px; height: 22px; background: #fff; }
        .nav-pill::before { left: -22px; -webkit-mask: radial-gradient(circle at bottom left, transparent 22px, #000 22px); mask: radial-gradient(circle at bottom left, transparent 22px, #000 22px); }
        .nav-pill::after { right: -22px; -webkit-mask: radial-gradient(circle at bottom right, transparent 22px, #000 22px); mask: radial-gradient(circle at bottom right, transparent 22px, #000 22px); }
        .nav-pill a, .nav-pill button {
            background: none; border: 0; cursor: pointer; font: inherit; font-weight: 500;
            color: #3a3a3a; padding: 6px 14px; border-radius: 8px; white-space: nowrap;
        }
        .nav-pill a:hover, .nav-pill button:hover { background: #FBEDE6; color: var(--accent-dark); }
        .nav-pill .primary { color: var(--accent-ink); background: var(--accent); }
        .nav-pill .primary:hover { background: var(--accent-dark); color: var(--accent-ink); }

        /* 히어로 본문 */
        .hero-body { position: relative; padding: 44px 40px 8px; color: #fff; }
        .hero-title { font-weight: 900; line-height: 1.08; font-size: clamp(38px, 6vw, 70px); margin: 0; text-wrap: balance; text-shadow: 0 2px 12px rgba(0,0,0,.35); }
        .hero-title .soft { color: rgba(255,255,255,.68); font-weight: 700; }

        .filter-bar {
            display: inline-flex; gap: 6px; margin-top: 28px;
            background: rgba(20,18,16,.5); backdrop-filter: blur(6px);
            padding: 8px; border-radius: 16px;
        }
        .filter-bar .seg { color: #F1ECE4; padding: 10px 22px; border-radius: 10px; font-weight: 500; }
        .filter-bar .seg:hover { background: rgba(255,255,255,.14); }
        .filter-bar .seg.on { background: var(--accent); color: var(--accent-ink); }

        .hero-note { margin-top: 30px; max-width: 460px; border-left: 3px solid var(--accent); padding-left: 16px; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
        .hero-note .lead { font-weight: 700; font-size: 20px; line-height: 1.35; margin: 0; }
        .hero-note .sub { opacity: .85; font-size: 13px; margin-top: 8px; }

        .admin-login { color: inherit; text-decoration: underline; }
        .admin-login:hover { color: var(--accent-dark); }

        @media (max-width: 640px) {
            .header-bar { padding: 0 16px; }
            .brand { font-size: 13px; }
            .hero-body { padding: 28px 20px 4px; }
            .site-header.has-hero { min-height: 440px; }
        }
    </style>
</head>
<body class="min-h-screen">

    <header class="site-header {% block header_class %}{% endblock %}">
        <div class="header-bar">
            <span class="brand">메이플 이벤트 정보 및 요약 모음</span>
            <nav class="nav-pill">
                <a href="{% url 'events:list' %}">홈</a>
                <a href="{% url 'events:archive' %}">지난 이벤트</a>
                {% if user.is_authenticated %}
                <a href="{% url 'events:write' %}" class="primary">글쓰기</a>
                <form method="post" action="{% url 'events:logout' %}" class="inline">
                    {% csrf_token %}
                    <button type="submit">로그아웃</button>
                </form>
                {% endif %}
            </nav>
            <span class="header-cta"></span>
        </div>
        {% block hero %}{% endblock %}
    </header>

    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer footer-center p-6 text-base-content/60 border-t border-base-300 bg-base-100">
        <p>
            메이플 이벤트 요약 · 개인 운영
            {% if not user.is_authenticated %}
            · <a href="{% url 'events:login' %}" class="admin-login">관리자 로그인</a>
            {% endif %}
        </p>
    </footer>

</body>
</html>
